<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exfat2ampr</title>
<style>
  :root { --bg:#0f1720; --card:#17222e; --line:#2b3a4a; --text:#e6edf3; --muted:#9fb0c0; --ok:#3ddc84; --warn:#ffb347; --err:#ff6b6b; --acc:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size: 22px; margin: 8px 0 4px; flex:1; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 500; display:flex; align-items:center; gap:8px; }
  .card h2 span { flex:1; }
  .src { display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; cursor:pointer; }
  .src:hover { background:#1e2b39; }
  .src input { accent-color: var(--acc); }
  .src .t { flex:1; min-width:0; }
  .src .t b { display:block; }
  .src .t small { color: var(--muted); word-break: break-all; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background:#24405f; color:#bcd3ff; white-space:nowrap; }
  .tag.done { background:#1c3f2d; color: var(--ok); }
  .tag.warn { background:#4a3516; color: var(--warn); }
  label.row { display:flex; align-items:center; gap:12px; margin: 8px 0; }
  label.row span.k { width: 180px; color: var(--muted); font-size: 13px; }
  input[type=range] { flex:1; }
  input[type=text], textarea, select { background:#0f1720; border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:8px; }
  input[type=text] { width: 260px; max-width:100%; }
  textarea { width:100%; min-height:120px; font-family: ui-monospace, monospace; font-size:12px; }
  button { background: var(--acc); color:#fff; border:0; padding:10px 18px; border-radius:8px; font-size:15px; cursor:pointer; }
  button.secondary { background:#2b3a4a; }
  button.small { padding:4px 10px; font-size:12px; }
  button.danger { background:#7a2e2e; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { height: 10px; background:#0f1720; border-radius: 999px; overflow:hidden; border:1px solid var(--line); }
  .bar > div { height:100%; background: var(--acc); width:0%; transition: width .4s; }
  .state { margin: 8px 0; font-size: 14px; }
  .state.done { color: var(--ok); } .state.error { color: var(--err); } .state.cancelled, .state.paused { color: var(--warn); }
  pre { background:#0b1118; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; max-height:260px; overflow:auto; white-space:pre-wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .stats { display:flex; gap:18px; flex-wrap:wrap; font-size:13px; margin:8px 0; color: var(--muted); }
  .stats span:first-child { color: var(--text); font-weight: 600; }
  .dest .free { font-size:12px; color: var(--muted); }
  .dest .gauge { height:6px; background:#0f1720; border-radius:999px; overflow:hidden; margin-top:4px; width: 180px; }
  .dest .gauge > div { height:100%; background:#6c8cb5; }
  .dest.ro { opacity:.5; }
  .banner { background:#3a2a10; border:1px solid #6b4a14; color:#ffd89a; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
.why { margin:6px 0 10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); line-height:1.45; }
.why.error { background:rgba(255,90,90,.10); border-color:rgba(255,90,90,.35); }
.why.warn { background:rgba(255,190,80,.10); border-color:rgba(255,190,80,.35); }
.why.ok { background:rgba(80,210,140,.10); border-color:rgba(80,210,140,.35); }
  .item { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .item .t { flex:1; min-width:0; } .item .t b { display:block; } .item .t small { color: var(--muted); word-break: break-all; }
  footer { color: var(--muted); font-size: 12px; margin: 10px 0 30px; word-break: break-all; }
  .preview { display:none; gap:16px; align-items:center; background:#0f1720; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .preview.on { display:flex; }
  .preview img { width:128px; height:128px; border-radius:16px; object-fit:cover; background:#1e2b39; flex:none; box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .preview .noicon { width:128px; height:128px; border-radius:16px; background:#1e2b39; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; flex:none; }
  .preview .t { min-width:0; }
  .preview .t b { font-size:18px; display:block; margin-bottom:4px; }
  .preview .t small { color: var(--muted); display:block; word-break: break-all; }
  html[dir=rtl] label.row span.k { text-align:right; }
  .state, #detail, #queue, .src .t b, .item .t b, .preview .t b { overflow-wrap:anywhere; }
  label.row select { min-width:0; max-width:100%; }
  #pair { position:fixed; inset:0; background:rgba(5,10,16,.92); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #pair.on { display:flex; }
  #pair .card { max-width:460px; width:100%; text-align:center; }
  #pair h2 { justify-content:center; color:var(--text); font-size:18px; }
  #pin { font-size:34px; letter-spacing:12px; text-align:center; width:100%; max-width:280px; padding:10px; font-family:ui-monospace,monospace; }
  #pairerr { color:var(--err); min-height:20px; margin:8px 0; font-size:13px; }
  .sync { font-size:12px; color:var(--ok); }
</style>
</head>
<body>
<div id="pair"><div class="card">
  <h2 data-i18n="pair_h"></h2>
  <p class="muted" data-i18n="pair_help"></p>
  <input id="pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" dir="ltr"
         onkeydown="if(event.key==='Enter')doPair(this.value)">
  <div id="pairerr"></div>
  <button onclick="doPair(document.getElementById('pin').value)" data-i18n="pair_btn"></button>
</div></div>
<main>
  <header>
    <h1>exfat2ampr <span id="ver" class="muted"></span> <span class="sync" id="sync" data-i18n="pair_sync" style="display:none"></span></h1>
    <select id="lang" onchange="setLang(this.value)">
      <option value="fr">Français</option><option value="en">English</option><option value="es">Español</option>
      <option value="it">Italiano</option><option value="ru">Русский</option><option value="ar">العربية</option>
      <option value="pt">Português</option><option value="zh">中文</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option>
    </select>
  </header>
  <div class="sub" data-i18n="subtitle"></div>
  <div class="banner" data-i18n="rest_warning"></div>
  <div class="banner" id="offline" style="display:none;background:#4a1d1d;border-color:#7a2e2e;color:#ffb4b4"></div>

  <div class="card">
    <h2><span data-i18n="src_h"></span><button class="secondary small" onclick="loadSources()" data-i18n="refresh"></button></h2>
    <div id="preview" class="preview"><img id="pimg" alt=""><div class="noicon" id="pnoicon" style="display:none">icon0.png ?</div><div class="t"><b><bdi id="ptitle2"></bdi></b><small id="pinfo"></small><small id="ppath" dir="ltr"></small></div></div>
    <div id="delstate" class="muted" style="display:none;margin-bottom:8px"></div>
    <div id="sources" class="muted" onchange="updatePreview()"></div>
    <label class="row" style="margin-top:10px"><span class="k" data-i18n="src_manual"></span><input type="text" id="manual" dir="ltr" placeholder="/mnt/usb0/homebrew/PPSA01234"></label>
  </div>

  <div class="card">
    <h2><span data-i18n="dest_h"></span><button class="secondary small" onclick="loadDest()" data-i18n="refresh"></button></h2>
    <div id="dests" class="muted"></div>
  </div>

  <div class="card">
    <h2><span data-i18n="opt_h"></span></h2>
    <label class="row"><span class="k" data-i18n="level"></span><input type="range" id="level" min="1" max="12" value="9" oninput="lv.textContent=this.value+(this.value>4?' (HC)':' (fast)')"><b id="lv">9 (HC)</b></label>
    <label class="row"><span class="k" data-i18n="threads"></span><input type="range" id="workers" min="1" max="12" value="6" oninput="wk.textContent=this.value"><b id="wk">6</b></label>
    <label class="row"><span class="k" data-i18n="folder_name"></span><input type="text" id="name" data-i18n-ph="folder_ph"></label>
    <label class="row"><span class="k" data-i18n="cache"></span><select id="cache"><option value="0" data-i18n="cache_std"></option><option value="1" data-i18n="cache_large"></option></select></label>
    <div class="muted" data-i18n="level_hint" style="margin:-2px 0 6px"></div>
    <label class="row"><input type="checkbox" id="verify" checked> <span data-i18n="verify"></span></label>
    <label class="row"><input type="checkbox" id="dedup" checked> <span data-i18n="dedup"></span></label>
    <label class="row"><input type="checkbox" id="clean" checked> <span data-i18n="clean"></span></label>
    <label class="row"><input type="checkbox" id="overwrite"> <span data-i18n="overwrite"></span></label>
    <label class="row"><input type="checkbox" id="remove"> <span data-i18n="remove"></span></label>
    <div class="btns">
      <button id="start" onclick="start()" data-i18n="convert"></button>
      <button id="pause" class="secondary" onclick="post('/api/pause').then(poll)" disabled data-i18n="pause"></button>
      <button id="cancel" class="danger" onclick="if(confirm(t('cancel_confirm'))) post('/api/cancel').then(poll)" disabled data-i18n="cancel"></button>
    </div>
  </div>

  <div class="card">
    <h2><span data-i18n="prog_h"></span></h2>
    <div class="state" id="state"></div>
    <div class="why" id="why" style="display:none"></div>
    <div class="btns" id="acts" style="display:none;margin:0 0 10px">
      <button id="retry" onclick="post(curState.resumable ? '/api/resume' : '/api/retry', curState.resumable ? {dest: curState.dest} : {}).then(poll)"></button>
      <button id="dismiss" class="secondary" onclick="post('/api/dismiss').then(poll)"></button>
    </div>
    <div class="bar"><div id="pct"></div></div>
    <div class="stats"><span id="pcttxt">0 %</span><span id="speed"></span><span id="eta"></span><span id="elapsed"></span></div>
    <div class="muted" id="detail"></div>
    <div class="muted" id="queue"></div>
    <pre id="log" dir="ltr"></pre>
  </div>

  <div class="card">
    <h2><span data-i18n="resumable_h"></span><button class="secondary small" onclick="loadResumable()" data-i18n="refresh"></button></h2>
    <div id="resumable" class="muted"></div>
  </div>

  <div class="card">
    <h2><span data-i18n="profiles_h"></span><button class="secondary small" onclick="post('/api/profiles/import-usb').then(loadProfiles)" data-i18n="profile_import"></button></h2>
    <div id="profiles" class="muted"></div>
    <label class="row" style="margin-top:10px"><span class="k" data-i18n="profile_title"></span><input type="text" id="ptitle" dir="ltr" placeholder="PPSA01234" style="width:160px"></label>
    <textarea id="ptoml" dir="ltr" data-i18n-ph="profile_toml"></textarea>
    <div class="btns"><button class="secondary" onclick="saveProfile()" data-i18n="profile_save"></button></div>
  </div>

  <div class="card">
    <h2><span data-i18n="tr_h"></span><button class="secondary small" onclick="loadTraces()" data-i18n="refresh"></button></h2>
    <p class="muted" data-i18n="tr_help"></p>
    <div id="traces" class="muted"></div>
  </div>

  <footer><span data-i18n="credits"></span> · <span id="runtime"></span> · <a href="#" style="color:var(--muted)" onclick="forgetDevice();return false" data-i18n="pair_forget"></a></footer>
</main>
<script>
let selected = null;
const I18N = {
fr:{credits:"Créé par V-10 · format LZ4 : DLPSGAME",loc_int:"Interne",pair_h:"Associer cet appareil à la PS5",pair_help:"Ouvre l'application exFAT2AMPR sur la PS5 (Réglages › Associer un PC ou un téléphone) ou regarde la notification du moteur, puis entre le code à 6 chiffres. Avec le QR code, l'association est automatique.",pair_btn:"Associer",pair_bad:"Code incorrect.",pair_blocked:"Trop d'essais : attends une minute (un nouveau code a été généré).",pair_forget:"Dissocier cet appareil",pair_sync:"Synchronisé avec la PS5",tr_h:"7. Optimisation par traces",tr_none:"Aucun jeu dans les dossiers homebrew.",tr_help:"1. Active le mode trace sur un jeu. 2. Lance le jeu et joue : démarrage, chargement d'une sauvegarde, plusieurs zones, puis quitte-le normalement. 3. Collecte la trace (une par session, répète 2 et 3 pour en avoir plusieurs). 4. Génère le profil : il s'applique tout seul à la prochaine conversion de ce jeu, garde donc la source. Désactive ensuite le mode trace : l'émulateur debug est plus lent.",tr_on:"Activer le mode trace",tr_off:"Désactiver",tr_collect:"Collecter la trace",tr_gen:"Générer le profil",tr_active:"mode trace actif",tr_pending:"trace à collecter",tr_count:"traces",tr_profile:"profil prêt",tr_conv:"converti",tr_loose:"non converti",tr_done:"Terminé",tr_wait:"Calcul en cours…",cache:"Cache de l'émulateur",cache_std:"Standard (128 + 32 Mo, 4 threads)",cache_large:"Grand, jeux en monde ouvert (192 + 64 Mo, 6 threads)",level_hint:"Décompresser du LZ4 coûte le même temps quel que soit le niveau : un niveau élevé (9 à 12) réduit les lectures disque sans ralentir le jeu, surtout sur USB. Un profil par jeu (section 6) remplace ces réglages.",offline:"Connexion à la console perdue, nouvelle tentative automatique… Si cela dure, vérifiez que la PS5 n'est pas en mode repos et que le payload est toujours chargé.",auto_mount:"monté automatiquement pendant la conversion",auto_mount_short:"montage auto",fakelib_off:"émulateur désactivé pour ce jeu dans ShadowMountPlus (fakelib_exclude)",not_managed:"non géré par ShadowMountPlus (doublon de Title ID ?)",smp_offline:"API ShadowMountPlus injoignable (version 1.7+ requise)",subtitle:"Convertit un jeu (dossier ou image exFAT montée) en pack AMPR LZ4, directement sur la console, dans le dossier homebrew du support choisi.",rest_warning:"Pendant une conversion, désactivez le mode repos de la console. Une interruption n'est pas grave : la conversion reprend là où elle s'est arrêtée.",src_h:"1. Source",refresh:"Rafraîchir",src_manual:"Chemin manuel",src_none:"Aucun jeu trouvé (USB:\\homebrew\\<jeu>, /mnt/shadowmnt, /data/homebrew). Branchez la clé ou montez l'image.",raw:"brut",already:"déjà AMPR",partial:"interrompu",image:"image",mounted:"montée",not_mounted:"non montée",mount:"Monter via ShadowMountPlus",mount_hint:"Demande envoyée à ShadowMountPlus (manual.lst). Rafraîchissez dans quelques secondes.",dest_h:"2. Destination",dest_none:"Aucun support détecté.",free_of:"libres sur",not_writable:"non inscriptible",kind_internal:"Interne",kind_extended:"SSD étendu",kind_usb:"USB",opt_h:"3. Options",level:"Niveau LZ4",threads:"Threads",folder_name:"Nom du dossier",folder_ph:"(Title ID par défaut)",verify:"Vérifier chaque bloc après la conversion (recommandé)",dedup:"Dédoublonner les blocs identiques",clean:"Nettoyer les restes de dump (_DUPLEX_, …/Saved)",overwrite:"Remplacer si le dossier existe déjà sur la destination",remove:"Supprimer la source après conversion réussie",convert:"Convertir / ajouter à la file",pause:"Pause",cancel:"Annuler",cancel_confirm:"Annuler et supprimer la conversion en cours ?",prog_h:"4. Progression",idle:"inactif",remaining:"temps restant",estimating:"estimation…",elapsed:"écoulé",queue_h:"File d'attente",resumable_h:"5. Conversions interrompues",resumable_none:"Aucune conversion interrompue.",stage:"étape",source_missing:"source absente : branchez la clé ou montez l'image",resume_btn:"Reprendre",discard:"Abandonner",discard_confirm:"Supprimer définitivement cette conversion interrompue ?",profiles_h:"6. Profils par jeu",profiles_none:"Aucun profil. Déposez des fichiers <TITLE_ID>.toml dans USB:\\homebrew\\profiles\\ ou collez-en un ci-dessous.",profile_title:"Title ID",profile_toml:"[[rule]]\naction = \"loose\"\ninclude = [\"data/streaming/**\"]",profile_save:"Enregistrer le profil",profile_import:"Importer depuis USB",profile_saved:"Profil enregistré.",profile_rejected:"Profil refusé (vérifiez le Title ID et la syntaxe).",choose_source:"Choisissez une source",choose_dest:"Choisissez une destination",runtime:"Émulateur AMPR",state_running:"en cours",state_done:"terminé",state_error:"erreur",state_cancelled:"annulé",state_paused:"en pause",ph_starting:"démarrage",ph_scan:"analyse de la source",ph_index:"index",ph_fakelib:"émulateur",ph_pack:"compression LZ4",ph_copy:"copie des fichiers",ph_verify:"vérification",ph_cleanup:"nettoyage",ph_remove:"suppression de la source",ph_done:"terminé",ph_paused:"en pause",ph_error:"erreur",ph_cancelled:"annulé",ph_mount:"montage de l'image",ph_unmount:"démontage de l'image",gb:"Go",mb:"Mo"},
en:{credits:"Made by V-10 · LZ4 format: DLPSGAME",loc_int:"Internal",pair_h:"Pair this device with the PS5",pair_help:"Open the exFAT2AMPR app on the PS5 (Settings › Pair a PC or phone) or look at the engine notification, then type the 6-digit code. Scanning the QR code pairs automatically.",pair_btn:"Pair",pair_bad:"Wrong code.",pair_blocked:"Too many attempts: wait a minute (a new code was generated).",pair_forget:"Unpair this device",pair_sync:"In sync with the PS5",tr_h:"7. Trace-based optimisation",tr_none:"No game in the homebrew folders.",tr_help:"1. Turn trace mode on for a game. 2. Start the game and play: boot, load a save, several areas, then quit it normally. 3. Collect the trace (one per session, repeat 2 and 3 to get several). 4. Generate the profile: it is applied automatically the next time this game is converted, so keep the source. Turn trace mode off afterwards: the debug emulator is slower.",tr_on:"Turn trace mode on",tr_off:"Turn off",tr_collect:"Collect trace",tr_gen:"Generate profile",tr_active:"trace mode on",tr_pending:"trace to collect",tr_count:"traces",tr_profile:"profile ready",tr_conv:"converted",tr_loose:"not converted",tr_done:"Done",tr_wait:"Computing…",cache:"Emulator cache",cache_std:"Standard (128 + 32 MB, 4 threads)",cache_large:"Large, open-world games (192 + 64 MB, 6 threads)",level_hint:"LZ4 decompression costs the same at every level: a high level (9 to 12) means fewer disk reads without slowing the game, especially on USB. A per-game profile (section 6) overrides these settings.",offline:"Lost connection to the console, retrying automatically… If this lasts, check that the PS5 is not in rest mode and the payload is still loaded.",auto_mount:"mounted automatically during the conversion",auto_mount_short:"auto mount",fakelib_off:"emulator disabled for this game in ShadowMountPlus (fakelib_exclude)",not_managed:"not managed by ShadowMountPlus (duplicate Title ID?)",smp_offline:"ShadowMountPlus API unreachable (1.7+ required)",s es:{credits:"Creado por V-10 · formato LZ4: DLPSGAME",loc_int:"Interno",pair_h:"Vincular este dispositivo con la PS5",pair_help:"Abre la aplicación exFAT2AMPR en la PS5 (Ajustes › Vincular un PC o un móvil) o mira la notificación del motor y escribe el código de 6 cifras. Con el código QR la vinculación es automática.",pair_btn:"Vincular",pair_bad:"Código incorrecto.",pair_blocked:"Demasiados intentos: espera un minuto (se ha generado un código nuevo).",pair_forget:"Desvincular este dispositivo",pair_sync:"Sincronizado con la PS5",tr_h:"7. Optimización por trazas",tr_none:"Ningún juego en las carpetas homebrew.",tr_help:"1. Activa el modo traza en un juego. 2. Inicia el juego y juega: arranque, carga de una partida, varias zonas, y luego ciérralo normalmente. 3. Recoge la traza (una por sesión, repite 2 y 3 para tener varias). 4. Genera el perfil: se aplica solo en la próxima conversión de este juego, así que conserva el origen. Después desactiva el modo traza: el emulador de depuración es más lento.",tr_on:"Activar modo traza",tr_off:"Desactivar",tr_collect:"Recoger traza",tr_gen:"Generar perfil",tr_active:"modo traza activo",tr_pending:"traza por recoger",tr_count:"trazas",tr_profile:"perfil listo",tr_conv:"convertido",tr_loose:"sin convertir",tr_done:"Hecho",tr_wait:"Calculando…",cache:"Caché del emulador",cache_std:"Estándar (128 + 32 MB, 4 hilos)",cache_large:"Grande, juegos de mundo abierto (192 + 64 MB, 6 hilos)",level_hint:"Descomprimir LZ4 cuesta lo mismo en cualquier nivel: un nivel alto (9 a 12) reduce las lecturas de disco sin ralentizar el juego, sobre todo en USB. Un perfil por juego (sección 6) sustituye estos ajustes.",offline:"Conexión con la consola perdida, reintentando automáticamente… Si dura, compruebe que la PS5 no está en reposo y que el payload sigue cargado.",auto_mount:"se monta automáticamente durante la conversión",auto_mount_short:"montaje auto",fakelib_off:"emulador desactivado para este juego en ShadowMountPlus (fakelib_exclude)",not_ it:{credits:"Creato da V-10 · formato LZ4: DLPSGAME",loc_int:"Interna",pair_h:"Associa questo dispositivo alla PS5",pair_help:"Apri l'app exFAT2AMPR sulla PS5 (Impostazioni › Associa un PC o un telefono) o guarda la notifica del motore, poi inserisci il codice di 6 cifre. Con il codice QR l'associazione è automatica.",pair_btn:"Associa",pair_bad:"Codice errato.",pair_blocked:"Troppi tentativi: attendi un minuto (è stato generato un nuovo codice).",pair_forget:"Dissocia questo dispositivo",pair_sync:"Sincronizzato con la PS5",tr_h:"7. Ottimizzazione tramite tracce",tr_none:"Nessun gioco nelle cartelle homebrew.",tr_help:"1. Attiva la modalità traccia su un gioco. 2. Avvia il gioco e gioca: avvio, caricamento di un salvataggio, diverse zone, poi chiudilo normalmente. 3. Raccogli la traccia (una per sessione, ripeti 2 e 3 per averne diverse). 4. Genera il profilo: verrà applicato da solo alla prossima conversione di questo gioco, quindi conserva la sorgente. Poi disattiva la modalità traccia: l'emulatore di debug è più lento.",tr_on:"Attiva modalità traccia",tr_off:"Disattiva",tr_collect:"Raccogli traccia",tr_gen:"Genera profilo",tr_active:"modalità traccia attiva",tr_pending:"traccia da raccogliere",tr_count:"tracce",tr_profile:"profilo pronto",tr_conv:"convertito",tr_loose:"non convertito",tr_done:"Fatto",tr_wait:"Calcolo in corso…",cache:"Cache dell'emulatore",cache_std:"Standard (128 + 32 MB, 4 thread)",cache_large:"Grande, giochi open world (192 + 64 MB, 6 thread)",level_hint:"Decomprimere LZ4 costa uguale a ogni livello: un livello alto (da 9 a 12) riduce le letture da disco senza rallentare il gioco, soprattutto su USB. Un profilo per gioco (sezione 6) sostituisce queste impostazioni.",offline:"Connessione alla console persa, nuovo tentativo automatico… Se continua, verifica che la PS5 non sia in riposo e che il payload sia ancora caricato.",auto_mount:"montata automaticamente durante la conversione",auto_mount_short:"montaggio auto",fakelib_off:"emulatore disat ru:{credits:"Автор: V-10 · формат LZ4: DLPSGAME",loc_int:"Внутренняя",pair_h:"Привязать это устройство к PS5",pair_help:"Откройте приложение exFAT2AMPR на PS5 (Настройки › Привязать ПК или телефон) или посмотрите уведомление движка и введите 6-значный код. QR-код привязывает автоматически.",pair_btn:"Привязать",pair_bad:"Неверный код.",pair_blocked:"Слишком много попыток: подождите минуту (создан новый код).",pair_forget:"Отвязать это устройство",pair_sync:"Синхронизировано с PS5",tr_h:"7. Оптимизация по трассировке",tr_none:"В папках homebrew нет игр.",tr_help:"1. Включите режим трассировки для игры. 2. Запустите игру и поиграйте: запуск, загрузка сохранения, несколько локаций, затем выйдите обычным способом. 3. Соберите трассу (одна за сеанс, повторите шаги 2 и 3, чтобы собрать несколько). 4. Создайте профиль: он применится автоматически при следующей конвертации этой игры, поэтому сохраните исходник. Затем выключите режим трассировки: отладочный эмулятор работает медленнее.",tr_on:"Включить трассировку",tr_off:"Выключить",tr_collect:"Собрать трассу",tr_gen:"Создать профиль",tr_active:"трассировка включена",tr_pending:"есть трасса для сбора",tr_count:"трасс",tr_profile:"профиль готов",tr_conv:"конвертирована",tr_loose:"не конвертирована",tr_done:"Готово",tr_wait:"Вычисление…",cache:"Кэш эмулятора",cache_std:"Стандартный (128 + 32 МБ, 4 потока)",cache_large:"Большой, игры с открытым миром (192 + 64 МБ, 6 потоков)",level_hint:"Распаковка LZ4 одинаково быстра на любом уровне: высокий уровень (9–12) уменьшает чтение с диска без замедления игры, особенно с USB. Профиль игры (раздел 6) заменяет эти настройки.",offline:"Связь с консолью потеряна, повторная попытка… Если это продолжается, проверьте, что PS5 не в режиме покоя и payload загружен.",auto_mount:"монтируется автоматически во время преобразования",auto_mount_short:"автомонтирование",fakelib_off:"эмулятор отключён для этой игры в ShadowMountPlus (fakelib_exclude)",not_managed:"не управляется ShadowMountPlus (дубликат Title ID?)",smp_offline:"API ShadowMountPlus недоступен (нужна версия 1.7+)",subtitle:"Преобразует игру (папку или смонтированный образ exFAT) в пакет AMPR LZ4 прямо на консоли, в папку homebrew выбранного накопителя.",rest_warning:"Во время преобразования отключите режим покоя. Прерывание не страшно: преобразование продолжится с места остановки.",src_h:"1. Источник",refresh:"Обновить",src_manual:"Путь вручную",src_none:"Игры не найдены (USB:\\homebrew\\<игра>, /mnt/shadowmnt, /data/homebrew). Подключите накопитель или смонтируйте образ.",raw:"исходная",already:"уже AMPR",partial:"прервано",image:"образ",mounted:"смонтирован",not_mounted:"не смонтирован",mount:"Смонтировать через ShadowMountPlus",mount_hint:"Запрос отправлен в ShadowMountPlus (manual.lst). Обновите через несколько секунд.",dest_h:"2. Назначение",dest_none:"Накопители не обнаружены.",free_of:"свободно из",not_writable:"недоступен для записи",kind_internal:"Встроенный",kind_extended:"Дополнительный SSD",kind_usb:"USB",opt_h:"3. Параметры",level:"Уровень LZ4",threads:"Потоки",folder_name:"Имя папки",folder_ph:"(по умолчанию Title ID)",verify:"Проверять каждый блок после преобразования (рекомендуется)",dedup:"Удалять дубликаты одинаковых блоков",clean:"Удалять остатки дампа (_DUPLEX_, …/Saved)",overwrite:"Заменить, если папка уже существует в назначении",remove:"Удалить источник после успешного преобразования",convert:"Преобразовать / в очередь",pause:"Пауза",cancel:"Отмена",cancel_confirm:"Отменить и удалить текущее преобразование?",prog_h:"4. Прогресс",idle:"ожидание",remaining:"осталось",estimating:"оценка…",elapsed:"прошло",queue_h:"Очередь",resumable_h:"5. Прерванные преобразования",resumable_none:"Прерванных преобразований нет.",stage:"этап",source_missing:"источник недоступен: подключите накопитель или смонтируйте образ",resume_btn:"Продолжить",discard:"Удалить",discard_confirm:"Окончательно удалить это прерванное преобразование?",profiles_h:"6. Профили для игр",profiles_none:"Профилей нет. ar:{credits:"من إعداد V-10 · تنسيق LZ4: DLPSGAME",loc_int:"داخلي",pair_h:"ربط هذا الجهاز بـ PS5",pair_help:"افتح تطبيق exFAT2AMPR على PS5 (الإعدادات › ربط حاسوب أو هاتف) أو انظر إلى إشعار المحرك، ثم أدخل الرمز المكون من 6 أرقام. مسح رمز QR يربط تلقائيًا.",pair_btn:"ربط",pair_bad:"رمز غير صحيح.",pair_blocked:"محاولات كثيرة: انتظر دقيقة (تم إنشاء رمز جديد).",pair_forget:"إلغاء ربط هذا الجهاز",pair_sync:"متزامن مع PS5",tr_h:"7. التحسين بواسطة التتبع",tr_none:"لا توجد ألعاب في مجلدات homebrew.",tr_help:"1. فعّل وضع التتبع للعبة. 2. شغّل اللعبة والعب: الإقلاع، تحميل حفظ، عدة مناطق، ثم أغلقها بشكل عادي. 3. اجمع التتبع (واحد لكل جلسة، كرر الخطوتين 2 و3 للحصول على عدة تتبعات). 4. أنشئ الملف الشخصي: يُطبَّق تلقائيًا عند التحويل التالي لهذه اللعبة، لذا احتفظ بالمصدر. بعد ذلك أوقف وضع التتبع: محاكي التصحيح أبطأ.",tr_on:"تفعيل وضع التتبع",tr_off:"إيقاف",tr_collect:"جمع التتبع",tr_gen:"إنشاء الملف الشخصي",tr_active:"وضع التتبع مفعّل",tr_pending:"تتبع بانتظار الجمع",tr_count:"تتبعات",tr_profile:"الملف جاهز",tr_conv:"محوَّلة",tr_loose:"غير محوَّلة",tr_done:"تم",tr_wait:"جارٍ الحساب…",cache:"ذاكرة المحاكي المؤقتة",cache_std:"قياسي (128 + 32 ميغابايت، 4 خيوط)",cache_large:"كبير، ألعاب العالم المفتوح (192 + 64 ميغابايت، 6 خيوط)",level_hint:"فك ضغط LZ4 يستغرق الوقت نفسه في كل المستويات: المستوى العالي (9 إلى 12) يقلل القراءة من القرص دون إبطاء اللعبة، خاصة على USB. ملف تعريف اللعبة (القسم 6) يحل محل هذه الإعدادات.",offline:"انقطع الاتصال بالجهاز، تتم إعادة المحاولة تلقائيًا… إذا استمر ذلك، تأكد من أن PS5 ليس في وضع الراحة وأن الـ payload ما زال محمّلًا.",auto_mount:"تُركَّب تلقائيًا أثناء التحويل",auto_mount_short:"تركيب تلقائي",fakelib_off:"المحاكي معطّل لهذه اللعبة في ShadowMountPlus (fakelib_exclude)",not_managed:"غير مُدارة من ShadowMountPlus (Title ID مكرر؟)",smp_offline:"واجهة ShadowMountPlus غير متاحة (يتطلب 1.7+)",subtitle:"يحوّل لعبة (مجلد أو صورة exFAT مُركَّبة) إلى حزمة AMPR LZ4 على الجهاز نفسه، داخل مجلد homebrew في وحدة التخزين المختارة.",rest_warning:"عطّل وضع الراحة أثن zh:{credits:"作者：V-10 · LZ4 格式：DLPSGAME",loc_int:"内置",pair_h:"将此设备与 PS5 配对",pair_help:"在 PS5 上打开 exFAT2AMPR 应用（设置 › 配对电脑或手机）或查看引擎的通知，然后输入 6 位代码。扫描二维码会自动配对。",pair_btn:"配对",pair_bad:"代码错误。",pair_blocked:"尝试次数过多：请等待一分钟（已生成新代码）。",pair_forget:"取消配对此设备",pair_sync:"已与 PS5 同步",tr_h:"7. 基于追踪的优化",tr_none:"homebrew 文件夹中没有游戏。",tr_help:"1. 为某个游戏开启追踪模式。2. 启动游戏并游玩：启动、读取存档、去几个区域，然后正常退出。3. 收集追踪（每次会话一个，重复 2 和 3 可收集多个）。4. 生成配置：下次转换此游戏时自动应用，所以请保留源文件。之后关闭追踪模式：调试模拟器较慢。",tr_on:"开启追踪模式",tr_off:"关闭",tr_collect:"收集追踪",tr_gen:"生成配置",tr_active:"追踪模式已开启",tr_pending:"有追踪待收集",tr_count:"条追踪",tr_profile:"配置已就绪",tr_conv:"已转换",tr_loose:"未转换",tr_done:"完成",tr_wait:"计算中…",cache:"模拟器缓存",cache_std:"标准（128 + 32 MB，4 线程）",cache_large:"大，开放世界游戏（192 + 64 MB，6 线程）",level_hint:"LZ4 解压在各个等级下开销相同：高等级（9 到 12）意味着更少的磁盘读取且不会拖慢游戏，在 USB 上尤其明显。单个游戏的配置（第 6 节）会覆盖这些设置。",offline:"与主机的连接已断开，正在自动重试… 如果一直这样，请确认 PS5 未处于休息模式且负载仍在运行。",auto_mount:"转换时自动挂载",auto_mount_short:"自动挂载",fakelib_off:"此游戏在 ShadowMountPlus 中已禁用模拟器（fakelib_exclude）",not_managed:"未被 ShadowMountPlus 管理（Title ID 重复？）",smp_offline:"无法访问 ShadowMountPlus API（需要 1.7+）",subtitle:"在主机上直接把游戏（文件夹或已挂载的 exFAT 镜像）转换为 AMPR LZ4 包，保存到所选存储的 homebrew 文件夹。",rest_warning:"转换时请关闭休息模式。中断没有关系：转换会从中断处继续。",src_h:"1. 源",refresh:"刷新",src_manual:"手动路径",src_none:"未找到游戏（USB:\\homebrew\\<游戏>、/mnt/shadowmnt、/data/homebrew）。请插入驱动器或挂载镜像。",raw:"原始",already:"已是 AMPR",partial:"已中断",image:"镜像",mounted:"已挂载",not_mounted:"未挂载",mount:"用 ShadowMountPlus 挂载",mount_hint:"已向 ShadowMountPlus 发送请求（manual.lst）。几秒后刷新。",dest_h:"2. 目标位置",dest_none:"未检测到存储。",free_of:"可用，共",not_writable:"不可写入",kind_internal:"内置",kind_extended:"扩展 SSD",kind_usb:"USB",opt_h:"3. 选项",level:"LZ4 等级",threads:"线程",folder_name:"文件夹名称",folder_ph:"（默认为 Title ID）",verify:"转换后校验每个数据块（推荐）",dedup:"合并相同的数据块",clean:"清理转储残留（_DUPLEX_、…/Saved）",overwrite:"如果目标位置已有该文件夹则替换",remove:"转换成功后删除源文件",convert:"转换 / 加入队列",pause:"暂停",cancel:"取消",cancel_confirm:"取消并删除正在进行的转换？",prog_h:"4. 进度",idle:"空闲",remaining:"剩余",estimating:"估算中…",elapsed:"已用时间",queue_h:"队列 th:{credits:"สร้างโดย V-10 · รูปแบบ LZ4: DLPSGAME",loc_int:"ภายใน",pair_h:"จับคู่อุปกรณ์นี้กับ PS5",pair_help:"เปิดแอป exFAT2AMPR บน PS5 (การตั้งค่า › จับคู่ PC หรือโทรศัพท์) หรือดูการแจ้งเตือนของเอนจิน แล้วพิมพ์รหัส 6 หลัก การสแกนคิวอาร์โค้ดจะจับคู่ให้อัตโนมัติ",pair_btn:"จับคู่",pair_bad:"รหัสไม่ถูกต้อง",pair_blocked:"ลองหลายครั้งเกินไป: รอสักครู่ (สร้างรหัสใหม่แล้ว)",pair_forget:"ยกเลิกการจับคู่อุปกรณ์นี้",pair_sync:"ซิงค์กับ PS5 แล้ว",tr_h:"7. การปรับแต่งด้วยการติดตาม",tr_none:"ไม่มีเกมในโฟลเดอร์ homebrew",tr_help:"1. เปิดโหมดติดตามให้เกม 2. เปิดเกมแล้วเล่น: เริ่มเกม โหลดเซฟ ไปหลายพื้นที่ แล้วออกจากเกมตามปกติ 3. เก็บข้อมูลการติดตาม (หนึ่งครั้งต่อเซสชัน ทำข้อ 2 และ 3 ซ้ำเพื่อได้หลายชุด) 4. สร้างโปรไฟล์: จะใช้โดยอัตโนมัติในการแปลงเกมนี้ครั้งต่อไป จึงต้องเก็บต้นฉบับไว้ จากนั้นปิดโหมดติดตาม: อีมูเลเตอร์ดีบักช้ากว่า",tr_on:"เปิดโหมดติดตาม",tr_off:"ปิด",tr_collect:"เก็บข้อมูลการติดตาม",tr_gen:"สร้างโปรไฟล์",tr_active:"เปิดโหมดติดตามอยู่",tr_pending:"มีข้อมูลรอเก็บ",tr_count:"ชุดข้อมูล",tr_profile:"โปรไฟล์พร้อมแล้ว",tr_conv:"แปลงแล้ว",tr_loose:"ยังไม่แปลง",tr_done:"เสร็จแล้ว",tr_wait:"กำลังคำนวณ…",cache:"แคชของอีมูเลเตอร์",cache_std:"มาตรฐาน (128 + 32 MB, 4 เธรด)",cache_large:"ใหญ่ เกมโลกเปิด (192 + 64 MB, 6 เธรด)",level_hint:"การคลายการบีบอัด LZ4 ใช้ทรัพยากรเท่ากันทุกระดับ: ระดับสูง (9 ถึง 12) ช่วยลดการอ่านดิสก์โดยไม่ทำให้เกมช้าลง โดยเฉพาะบน USB โปรไฟล์ต่อเกม (ส่วนที่ 6) จะแทนที่การตั้งค่าเหล่านี้",offline:"การเชื่อมต่อกับคอนโซลขาดหาย กำลังลองใหม่อัตโนมัติ… ถ้ายังเป็นอยู่ ให้ตรวจสอบว่า PS5 ไม่ได้อยู่ในโหมดพักและเพย์โหลดยังทำงานอยู่",auto_mount:"เมานต์อัตโนมัติระหว่างการแปลง",auto_mount_short:"เมานต์อัตโนมัติ",fakelib_off:"ปิดอีมูเลเตอร์สำหรับเกมนี้ใน ShadowMountPlus (fakelib_exclude)",not_managed:"ShadowMountPlus ไม่ได้จัดการ (Title ID ซ้ำ?)",smp_offline:"เข้าถึง API ของ ShadowMountPlus ไม่ได้ (ต้องใช้ 1.7 ขึ้นไป)",subtitle:"แปลงเกม (โฟลเดอร์หรืออิมเมจ exFAT ที่เมานต์แล้ว) เป็นแพ็ก AMPR LZ4 บนคอนโซลเอง ลงในโฟลเดอร์ homebrew ของที่เก็บข้อมูลที่เลือก",rest_warning:"ปิดโหมดพักระหว่างการแปลง การขัดจังหวะไม่เป็นปัญหา: การแปลงจะทำต่อจากจุดที่หยุดไว้",src_h:"1. ต้นฉบับ",refresh:"รีเฟรช",src_manual:"เส้นทางกำหนดเอง",src_none:"ไม่พบเกม (USB:\\homebrew\\<เกม>, /mnt/shadowmnt, /data/homebrew) เสียบไดรฟ์หรือเมานต์อิมเมจ",raw:"ดิบ",already:"เป็น AMPR แล้ว",partial:"ถูกขัดจังหวะ",image:"อิมเมจ",mounted:"เมานต์แล้ว",not_mounted:"ยังไม่เมานต์",mount:"เมานต์ด้วย ShadowMountPlus",mount_hint:"ส่งคำขอไปยัง ShadowMountPlus แล้ว (manual.lst) รีเฟรชในอีกไม่กี่วินาที",dest_h:"2. ปลายทาง",dest_none:"ไม่พบที่เก็บข้อมูล",free_of:"ว่างจาก",not_writable:"เขียนไม่ได้",kind_internal:"ภายใน",kind_extended:"SSD เสริม",kind_usb:"USB",opt_h:"3. ตัวเลือก",level:"ระดับ LZ4",threads:"เธรด",folder_name:"ชื่อโฟลเดอร์",folder_ph:"(ค่าเริ่มต้นคือ Title ID)",verify:"ตรวจสอบทุกบล็อกหลังการแปลง (แนะนำ)",dedup:"รวมบล็อกที่เหมือนกัน",clean:"ล้างไฟล์ที่หลงเหลือจากการดัมพ์ (_DUPLEX_, …/Saved)",overwrite:"แทนที่ถ้ามีโฟลเดอร์นี้อยู่ที่ปลายทางแล้ว",remove:"ลบต้นฉบับเมื่อแปลงสำเร็จ",convert:"แปลง / เพิ่มในคิว",pause:"หยุดชั่วคราว",cancel:"ยกเลิก",cancel_confirm:"ยกเลิกและลบการแปลงที่กำลังทำอยู่หรือไม่?",prog_h:"4. ความคืบหน้า",idle:"ว่าง",remaining:"ที่เหลือ",estimating:"กำลังประเมิน…",elapsed:"ใช้เวลาไป",queue_h:"คิว",resumable_h:"5. การแปลงที่ถูกขัดจังหวะ",resumable_none:"ไม่มีการแปลงที่ถูกขัดจังหวะ",stage:"ขั้นตอน",source_missing:"ไม่พบต้นฉบับ: เสียบไดรฟ์หรือเมานต์อิมเมจ",resume_btn:"ทำต่อ",discard:"ทิ้ง",discard_confirm:"ลบการแปลงที่ถูกขัดจังหวะนี้อย่างถาวรหรือไม่?",profiles_h:"6. โปรไฟล์ต่อเกม",profiles_none:"ไม่มีโปรไฟล์ วางไฟล์ <TITLE_ID>.toml ไว้ใน USB:\\homebrew\\profiles\\ หรือวางข้อความด้านล่าง",profile_title:"Title ID",profile_toml:"[[rule]]\naction = \"loose\"\ninclude = [\"data/streaming/**\"]",profile_save:"บันทึกโปรไฟล์",profile_import:"นำเข้าจาก USB",profile_saved:"บันทึกโปรไฟล์แล้ว",profile_rejected:"โปรไฟล์ถูกปฏิเสธ (ตรวจสอบ Title ID และไวยากรณ์)",choose_source:"เลือกต้นฉบับ",choose_dest:"เลือกปลายทาง",runtime:"อีมูเลเตอร์ AMPR",state_running:"กำลังทำงาน",state_ /* where a game is kept: the console's storage, a USB drive (/mnt/usbN) or the M.2 SSD (/mnt/extN) */
function loc(p){
  let m;
  if (/^\/(data|user)\//.test(p || '')) return t('loc_int');
  if ((m = /^\/mnt\/usb(\d)/.exec(p || ''))) return 'USB ' + m[1];
  if ((m = /^\/mnt\/ext(\d)/.exec(p || ''))) return m[1] === '0' ? 'SSD M.2' : 'M.2 (ext' + m[1] + ')';
  return '';
}

const CODE_ALIAS = {"dest_unavailable": "dest_missing", "bad_name": "bad_path"};
function ct(k){ k = CODE_ALIAS[k] || k; return (CODES[LANG] && CODES[LANG][k]) || CODES.en[k] || ''; }
function codeText(code, reason){
  if (code === 'smp_busy') return ct(!reason || reason === 'game_active' ? 'smp_busy_game_active' : ct('smp_busy_' + reason) ? 'smp_busy_' + reason : 'smp_busy');
  return code ? ct(code) : '';
}
let curState = {};
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('lang').value = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
}
function setLang(l){ LANG = l; try { localStorage.setItem('e2a_lang', l); } catch(e) {} applyLang(); loadSources(); loadDest(); loadResumable(); loadProfiles(); loadTraces(); }

function fmt(b){ if(!b) return '0'; const g=b/1073741824; return g>=1? g.toFixed(1)+' '+t('gb') : (b/1048576).toFixed(0)+' '+t('mb'); }
function fmtDur(s){ if (s==null || s<0) return '—'; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h} h ${String(m).padStart(2,'0')} min` : m? `${m} min ${String(x).padStart(2,'0')} s` : `${x} s`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* pairing: every request carries this device's token (the PS5 app talks locally and needs none) */
let TOKEN = '';
try { TOKEN = localStorage.getItem('e2a_token') || ''; } catch(e) {}
function H(h){ h = h || {}; if (TOKEN) h['X-E2A-Token'] = TOKEN; return h; }
async function api(url, opt){
  opt = opt || {}; opt.headers = H(opt.headers);
  const r = await fetch(url, opt);
  if (r.status === 401) { showPair(); throw new Error('pair'); }
  return r;
}
function tq(){ return TOKEN ? '&t=' + encodeURIComponent(TOKEN) : ''; }
function showPair(){ document.getElementById('pair').classList.add('on'); setTimeout(() => document.getElementById('pin').focus(), 50); }
async function doPair(pin){
  pin = String(pin || '').replace(/\D/g, '');
  const err = document.getElementById('pairerr');
  err.textContent = '';
  try {
    const r = await fetch('/api/pair', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({pin})});
    const j = await r.json();
    if (!j.token) { err.textContent = t(r.status === 429 ? 'pair_blocked' : 'pair_bad'); return; }
    TOKEN = j.token;
    try { localStorage.setItem('e2a_token', TOKEN); } catch(e) {}
    document.getElementById('pair').classList.remove('on');
    try { history.replaceState(null, '', location.pathname); } catch(e) {}
    init();
  } catch(e) { err.textContent = String(e); }
}
function forgetDevice(){ try { localStorage.removeItem('e2a_token'); } catch(e) {} TOKEN = ''; showPair(); }
async function getJSON(url){ const r = await api(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function post(url, data){ const r = await api(url, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams(data||{})}); return r.json(); }

let SOURCES = [];
function selectedSource(){
  const radio = document.querySelector('input[name=src]:checked');
  return radio ? SOURCES[+radio.value] : null;
}
function updatePreview(){
  const box = document.getElementById('preview');
  const s = selectedSource();
  if (!s) { box.classList.remove('on'); return; }
  const img = document.getElementById('pimg'), noicon = document.getElementById('pnoicon');
  img.style.display = ''; noicon.style.display = 'none';
  img.onerror = () => { img.style.display = 'none'; noicon.style.display = 'flex'; };
  /* the path and the title ID: the engine looks in the folder, the mounted image, ShadowMountPlus and the
     console's own copy of the title's pictures (duplicates and images ShadowMountPlus skipped included) */
  img.src = window.MOCK_ICON ? window.MOCK_ICON : '/api/icon?path=' + encodeURIComponent(s.path) + '&title_id=' + encodeURIComponent(s.title_id || s.smp_title || '') + tq();
  document.getElementById('ptitle2').textContent = s.title || s.title_id || s.path.split('/').pop();
  document.getElementById('pinfo').textContent = s.type === 'image'
    ? `${s.title_id} · v${s.version} · ${t('image')} ${s.image_type || ''} · ${fmt(s.size)}${s.mounted ? '' : ' · ' + t('auto_mount')}${s.fakelib === false ? ' · ⚠ ' + t('fakelib_off') : ''}`
    : `${s.title_id} · v${s.version}${s.ampr ? ' · ' + t('already') : ''}${s.partial ? ' · ' + t('partial') : ''}`;
  document.getElementById('ppath').textContent = s.path;
  box.classList.add('on');
}
async function loadSources(){
  const el = document.getElementById('sources');
  try {
    const list = await getJSON('/api/sources');
    const prev = selectedSource();
    SOURCES = list;
    if (!list.length) { el.textContent = t('src_none'); updatePreview(); return; }
    let firstSel = prev ? list.findIndex(s => s.path === prev.path && s.selectable !== false) : -1;
    if (firstSel < 0) firstSel = list.findIndex(s => s.selectable !== false);
    const copies = {};
    list.forEach(s => { if (s.title_id) copies[s.title_id] = (copies[s.title_id] || 0) + 1; });
    const dup = s => (loc(s.path) ? '<span class="tag">' + esc(loc(s.path)) + '</span>' : '') +
      (s.title_id && copies[s.title_id] > 1 ? '<span class="tag warn">' + ct('dup') + '</span>' : '');
    const del = i => `<button class="danger small" style="margin-inline-start:8px" onclick="event.preventDefault();event.stopPropagation();delSource(${i})">${ct('del_btn')}</button>`;
    el.innerHTML = list.map((s,i)=> s.type === 'image' ? `
      <label class="src${s.selectable ? '' : ' dest ro'}"><input type="radio" name="src" value="${i}" ${i===firstSel?'checked':''} ${s.selectable?'':'disabled'}>
        <div class="t"><b><bdi>${esc(s.title || s.path.split('/').pop())}</bdi></b><small><bdi>${esc(s.path)}</bdi> · ${esc(s.title_id||'?')} · ${fmt(s.size)} · ${t('image')} ${esc(s.image_type||'')}${s.selectable ? '' : ' · ' + t(s.reason || 'not_managed')}</small></div>
        ${dup(s)}${s.mounted ? '<span class="tag done">'+t('mounted')+'</span>' : s.selectable ? '<span class="tag">'+t('auto_mount_short')+'</span>' : ''}${del(i)}</label>` : `
      <label class="src"><input type="radio" name="src" value="${i}" ${i===firstSel?'checked':''}>
        <div class="t"><b><bdi>${esc(s.title||s.title_id)}</bdi></b><small><bdi>${esc(s.path)}</bdi> · ${esc(s.title_id)} · v${esc(s.version)}</small></div>
        ${dup(s)}${s.partial?'<span class="tag warn">'+t('partial')+'</span>': s.ampr?'<span class="tag done">'+t('already')+'</span>':'<span class="tag">'+t('raw')+'</span>'}${del(i)}</label>`).join('');
    updatePreview();
  } catch(e) { el.textContent = 'Error: '+e; }
}
/* a copy deleted for good (duplicates, old versions): confirmed with its path, refused by the engine when in use */
async function delSource(i){
  const s = SOURCES[i];
  if (!s) return;
  const name = s.title || s.title_id || s.path.split('/').pop();
  if (!confirm(ct('del_q').replace('{t}', name).replace('{p}', s.path))) return;
  const j = await post('/api/delete-source', {path: s.path});
  if (j.error) alert(codeText(j.code) || j.error);
  poll();
}
const KIND = {internal:'kind_internal', extended:'kind_extended', usb:'kind_usb'};
async function loadDest(){
  const el = document.getElementById('dests');
  try {
    const list = await getJSON('/api/destinations');
    const prev = (document.querySelector('input[name=dest]:checked') || {}).value;
    if (!list.length) { el.textContent = t('dest_none'); return; }
    let selIdx = list.findIndex(d => d.writable && d.path === prev);
    if (selIdx < 0) selIdx = list[0].writable ? 0 : -1;
    el.innerHTML = list.map((d,i)=>{ const used = d.total ? Math.round((d.total-d.free)*100/d.total) : 0; return `
      <label class="src dest ${d.writable?'':'ro'}"><input type="radio" name="dest" value="${esc(d.path)}" ${i===selIdx?'checked':''} ${d.writable?'':'disabled'}>
      <div class="t"><b>${esc(d.label)}</b><small><bdi>${esc(d.path)}</bdi> · ${t(KIND[d.kind]||'kind_usb')}${d.fstype?' · '+esc(d.fstype):''}${d.writable?'':' · '+t('not_writable')}</small>
      <div class="free">${fmt(d.free)} ${t('free_of')} ${fmt(d.total)}</div><div class="gauge"><div style="width:${used}%"></div></div></div></label>`; }).join('');
  } catch(e) { el.textContent = 'Error: '+e; }
}
async function loadResumable(){

    const list = await getJSON('/api/resumable');

    el.innerHTML = list.map(x => `<div class="item"><div class="t"><b><bdi>${esc(x.name)}</bdi></b><small><bdi>${esc(x.dest)}</bdi> · ${t('stage')}: ${esc(t('ph_'+x.stage))} · LZ4 ${x.level}<br><bdi>${esc(x.source)}</bdi>${x.source_available?'':' · <span style="color:var(--warn)">'+t('source_missing')+'</span>'}</small></div>
      <button class="small" ${x.active||!x.source_available?'disabled':''} onclick="post('/api/resume',{dest:${esc(JSON.stringify(x.dest))}}).then(j=>{if(j.error)alert(j.error);loadResumable();poll();})">${t('resume_btn')}</button>
      <button class="danger small" ${x.active?'disabled':''} onclick="if(confirm(t('discard_confirm')))post('/api/discard',{dest:${esc(JSON.stringify(x.dest))}}).then(()=>{loadResumable();loadSources();loadDest();})">${t('discard')}</button></div>`).join('');
  } catch(e) { el.textContent = 'Error: '+e; }
}
async function loadProfiles(){
  const el = document.getElementById('profiles');
  try {
    const list = await getJSON('/api/profiles');
    el.innerHTML = list.length ? list.map(p => `<span class="tag">${esc(p)}</span> `).join('') : t('profiles_none');
  } catch(e) { el.textContent = 'Error: '+e; }
}
async function loadTraces(){
  const el = document.getElementById('traces');
  try {
    const list = await getJSON('/api/traces');
    if (!list.length) { el.textContent = t('tr_none'); return; }
    el.innerHTML = list.map(g => {
      const p = esc(JSON.stringify({path: g.path})), id = esc(JSON.stringify({title_id: g.title_id}));
      const tags = [g.converted ? t('tr_conv') : t('tr_loose')];
      if (g.trace_mode) tags.push(t('tr_active'));
      if (g.pending) tags.push(t('tr_pending'));
      if (g.collected) tags.push(g.collected + ' ' + t('tr_count'));
      if (g.profile) tags.push(t('tr_profile'));
      return `<div class="item"><div class="t"><b><bdi>${esc(g.title || g.title_id)}</bdi></b><small>${esc(g.title_id)} · <bdi>${esc(g.path)}</bdi><br>${tags.map(x => `<span class="tag">${esc(x)}</span>`).join(' ')}</small></div>
        ${g.trace_mode ? `<button class="secondary small" onclick='traceOp("disable", ${p})'>${t('tr_off')}</button>` : `<button class="small" onclick='traceOp("enable", ${p})'>${t('tr_on')}</button>`}
        <button class="secondary small" ${g.pending ? '' : 'disabled'} onclick='traceOp("collect", ${p})'>${t('tr_collect')}</button>
        <button class="small" ${g.collected ? '' : 'disabled'} onclick='traceOp("generate", ${id})'>${t('tr_gen')}</button></div>`;
    }).join('');
  } catch(e) { el.textContent = 'Error: '+e; }
}
async function traceOp(op, data){
  const el = document.getElementById('traces');
  el.style.opacity = .5;
  if (op === 'generate') el.insertAdjacentHTML('afterbegin', `<p>${t('tr_wait')}</p>`);
  try {
    const j = await post('/api/trace/' + op, data);
    if (j.error) alert(j.error);
    else if (op === 'collect' || op === 'generate') alert(t('tr_done') + (j.info ? ' : ' + j.info : ''));
  } catch(e) { alert('Error: ' + e); }
  el.style.opacity = 1;
  loadTraces(); loadProfiles();
}
async function saveProfile(){
  const j = await post('/api/profile', {title_id: document.getElementById('ptitle').value.trim(), toml: document.getElementById('ptoml').value});
  alert(j.error ? t('profile_rejected') : t('profile_saved'));
  loadProfiles();
}
async function start(){
  const manual = document.getElementById('manual').value.trim();
  const sel = selectedSource();
  const path = manual || (sel && (sel.type === 'image' ? sel.path : sel.path));
  const smp = !manual && sel && sel.type === 'image' && sel.smp_title ? sel.smp_title : '';
  if (!path) { alert(t('choose_source')); return; }
  const dradio = document.querySelector('input[name=dest]:checked');
  if (!dradio) { alert(t('choose_dest')); return; }
  const j = await post('/api/start', {path, smp, dest: dradio.value, name: document.getElementById('name').value.trim(),
    level: document.getElementById('level').value, workers: document.getElementById('workers').value,
    clean: document.getElementById('clean').checked?1:0, overwrite: document.getElementById('overwrite').checked?1:0,
    remove: document.getElementById('remove').checked?1:0, verify: document.getElementById('verify').checked?1:0,
    dedup: document.getElementById('dedup').checked?1:0, cache: document.getElementById('cache').value});
  if (j.error) alert(codeText(j.code) || j.error);
  poll();
}
let lastKey = '', offlineSince = 0, pollTimer = 0, pollSeq = 0, lastRev = null, lastDel = null;
async function poll(){
  const seq = ++pollSeq;          /* a newer poll() call supersedes this chain */
  clearTimeout(pollTimer);
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    let s;
    try { const r = await api('/api/state', {signal: ctl.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); s = await r.json(); }
    finally { clearTimeout(to); }
    if (seq !== pollSeq) return;
    document.getElementById('ver').textContent = /^\d/.test(s.version || '') ? 'v' + s.version : (s.version || '');
    const st = document.getElementById('state');
    st.className = 'state ' + s.state;
    const ph = t('ph_'+s.phase) !== 'ph_'+s.phase ? t('ph_'+s.phase) : s.phase;
    curState = s;
    const why = codeText(s.code, s.reason);
    st.textContent = s.waiting ? ct('waiting') : s.state === 'running' ? `${ph} — ${s.message}` : s.state === 'idle' ? t('idle') : t('state_'+s.state);
    const wb = document.getElementById('why');
    wb.style.display = why && s.state !== 'idle' ? '' : 'none';
    wb.textContent = why || '';
    wb.className = 'why ' + (s.state === 'error' ? 'error' : s.state === 'done' ? 'ok' : s.waiting || s.state === 'paused' ? 'warn' : '');
    /* never stuck on a result: start it again, resume it, or clear it */
    const failed = s.state === 'error' || s.state === 'cancelled';
    document.getElementById('acts').style.display = failed || s.state === 'done' ? '' : 'none';
    const rb = document.getElementById('retry');
    rb.style.display = failed && (s.resumable || s.can_retry) ? '' : 'none';
    rb.textContent = ct(s.resumable ? 'act_resume' : s.state === 'error' ? 'act_retry' : 'act_restart');
    document.getElementById('dismiss').textContent = ct('act_clear');
    const pct = s.state==='running' || s.state==='paused' ? s.percent : s.state==='done' ? 100 : 0;
    document.getElementById('pct').style.width = pct + '%';
    document.getElementById('pcttxt').textContent = pct + ' %' + (s.bytes_total ? ` (${fmt(s.bytes_done)} / ${fmt(s.bytes_total)})` : '');
    document.getElementById('speed').textContent = s.state==='running' && s.speed_bps>0 ? `${(s.speed_bps/1048576).toFixed(1)} ${t('mb')}/s` : '';
    document.getElementById('eta').textContent = s.state==='running' ? `${t('remaining')} : ${s.eta_seconds>=0 ? fmtDur(s.eta_seconds) : t('estimating')}` : '';
    const now = Math.floor(Date.now()/1000);
    document.getElementById('elapsed').textContent = s.started ? `${t('elapsed')} : ${fmtDur((s.state==='running'? now : s.finished) - s.started)}` : '';
    document.getElementById('detail').textContent = s.title_id ? `${s.title} [${s.title_id}] → ${s.dest} · ${fmt(s.source_bytes)}${s.packed_bytes?' → '+fmt(s.packed_bytes):''}${s.shared_bytes?' · dedup '+fmt(s.shared_bytes):''}${s.profile?' · profile: '+s.profile.split('/').pop():''}` : '';
    document.getElementById('queue').textContent = s.queue && s.queue.length ? `${t('queue_h')}: ${s.queue.join(' · ')}` : '';
    document.getElementById('log').textContent = s.log;
    document.getElementById('pause').disabled = s.state !== 'running' || !!s.waiting;
    document.getElementById('cancel').disabled = s.state !== 'running';
    if (s.runtime) document.getElementById('runtime').textContent = `${t('runtime')}: ${s.runtime.path} · sha256 ${s.runtime.sha256.slice(0,16)}… · ${s.runtime.format}${s.runtime.ok?'':' · WARNING'}`;
    /* a drive was plugged in or removed: the lists follow */
    if (s.storage_rev !== undefined && s.storage_rev !== lastRev) { if (lastRev !== null) { loadDest(); loadSources(); loadResumable(); } lastRev = s.storage_rev; }
    const ds = document.getElementById('delstate');
    if (s.deleting) { ds.style.display = ''; ds.textContent = ct('deleting').replace('{t}', s.delete_title || ''); }
    if (s.delete_seq !== undefined && s.delete_seq !== lastDel) {
      if (lastDel !== null) {
        ds.style.display = '';
        ds.textContent = s.delete_ok ? ct('deleted').replace('{t}', s.delete_title || '') : codeText(s.delete_code);
        loadSources(); loadResumable();
      }
      lastDel = s.delete_seq;
    } else if (!s.deleting && lastDel !== null && ds.textContent.endsWith('…')) ds.style.display = 'none';
    const key = s.state + '|' + s.dest;
    if (key !== lastKey) { lastKey = key; loadResumable(); if (s.state !== 'running') { loadSources(); loadDest(); } }
    if (offlineSince) { offlineSince = 0; document.getElementById('offline').style.display = 'none'; loadSources(); loadDest(); loadResumable(); }
  } catch(e) {
    if (seq !== pollSeq) return;
    if (e && e.message === 'pair') return;   /* the pairing screen is showing: not an outage */
    if (!offlineSince) offlineSince = Date.now();
    const b = document.getElementById('offline');
    b.textContent = t('offline') + ' (' + Math.round((Date.now() - offlineSince) / 1000) + ' s)';
    b.style.display = '';
  }
  pollTimer = setTimeout(poll, offlineSince ? 3000 : 2000);
}
async function init(){
  try {
    const h = await (await fetch('/api/hello', {headers: H()})).json();
    if (!h.paired) {
      const pin = new URLSearchParams(location.search).get('pin');   /* from the QR code shown by the PS5 app */
      if (pin) { document.getElementById('pin').value = pin; return doPair(pin); }
      showPair();
      return;
    }
    document.getElementById('sync').style.display = h.local ? 'none' : '';
  } catch(e) {}
  loadSources(); loadDest(); loadResumable(); loadProfiles(); loadTraces(); poll();
}
applyLang(); init();
</script>
